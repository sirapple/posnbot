name: Check sc.su.ac.th
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test notification to Discord"
        required: false
        default: false
        type: boolean

concurrency:
  group: posn-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Run POSNBot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SEND_TEST: ${{ github.event.inputs.test_message }}
        run: python -u posn_bot.py
      - name: Save updated state
        run: |
          git config user.name "POSNBot"
          git config user.email "bot@users.noreply.github.com"
          git add posn_state.json
          git diff --staged --quiet || (git commit -m "Update page state" && git push)
      - name: Trigger next run automatically
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run "check.yml" --repo "${{ github.repository }}"
